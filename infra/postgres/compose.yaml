name: kekebeauty-merise
services:
  db:
    image: postgres:17
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_DB: keke_merise
      POSTGRES_USER: keke_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - merise_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keke_owner -d keke_merise"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  merise_data:
